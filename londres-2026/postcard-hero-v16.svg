<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="poster-title poster-desc">
<title id="poster-title">Postal navideña de La Patrulla Polar en Londres</title>
<desc id="poster-desc">Ilustración original de Tower Bridge en rosa y azul sobre un cielo melocotón, con nieve, un autobús rojo, decoración navideña y tres pequeños perros polares.</desc>
